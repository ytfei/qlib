name: Build Wheels

on:
  push:
    branches:
      - main
      - master
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:
    inputs:
      upload_artifact:
        description: 'Upload wheels as artifacts'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13']
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install cython numpy build

      - name: Build wheel
        run: |
          python -m build --wheel

      - name: Check wheel
        run: |
          pip install twine
          twine check dist/*.whl

      - name: Upload wheels as artifacts
        if: github.event.inputs.upload_artifact != 'false' || github.event_name != 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*.whl
          retention-days: 7

  build_manylinux:
    name: Build manylinux wheels
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13']
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build manylinux wheels
        uses: RalfG/python-wheels-manylinux-build@v0.7.1-manylinux2014_x86_64
        with:
          python-versions: 'cp38-cp38 cp39-cp39 cp310-cp310 cp311-cp311 cp312-cp312 cp313-cp313'
          build-requirements: 'numpy cython'

      - name: Check wheels
        run: |
          pip install twine
          twine check dist/pyqlib-*-manylinux*.whl

      - name: Upload manylinux wheels as artifacts
        if: github.event.inputs.upload_artifact != 'false' || github.event_name != 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: manylinux-py${{ matrix.python-version }}
          path: dist/pyqlib-*-manylinux*.whl
          retention-days: 7

