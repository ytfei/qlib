name: Build Wheels

on:
  push:
    branches:
      - fintech
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      upload_artifact:
        description: 'Upload wheels as artifacts'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.13']
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install cython numpy build

      - name: Build wheel
        run: |
          python -m build --wheel

      - name: Check wheel
        run: |
          pip install twine
          twine check dist/*.whl

      - name: Upload wheels as artifacts
        if: github.event.inputs.upload_artifact != 'false' || github.event_name != 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}-${{ matrix.python-version }}
          path: dist/
          retention-days: 7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image tags
        id: set_tags
        run: |
          # 镜像名格式：自建仓库地址/项目名/镜像名:标签
          IMAGE_NAME="${{ secrets.DOCKER_REGISTRY }}/fin-proj/qlib"
          # 标签1：提交的短哈希（如 abc1234）
          TAG_SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          # 标签2：latest（可选）
          echo "tags=${IMAGE_NAME}:${TAG_SHORT_SHA},${IMAGE_NAME}:latest" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.set_tags.outputs.tags }}  # 使用步骤2生成的标签
          # 可选：启用构建缓存，加速后续构建
          cache-from: type=registry,ref=${{ secrets.DOCKER_REGISTRY }}/fin-proj/qlib:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_REGISTRY }}/fin-proj/qlib:buildcache,mode=max
          platforms: linux/amd64

      - name: Image digest
        run: echo "Image pushed with digest ${{ steps.build.outputs.digest }}"